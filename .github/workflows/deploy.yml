# main に push すると、スライドをビルドして GitHub Pages に公開する
# 事前に、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 公開先は https://<ユーザー名>.github.io/<リポジトリ名>/ なので、base にリポジトリ名を付ける
      - run: npx slidev build --base "/$REPO_NAME/"
        env:
          REPO_NAME: ${{ github.event.repository.name }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
